[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "op-research-algorithms"
version = "0.1.0"
description = "Operations Research algorithm examples using Gurobi, for educational use"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gurobipy>=13.0.2",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "notebook>=7.5.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyomo>=6.10.0",
]
